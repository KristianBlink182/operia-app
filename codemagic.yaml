workflows:
  # WORKFLOW 1: GENERACIÓN DE APK PARA ANDROID
  android-release:
    name: Operia Android APK Release
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Instalar dependencias
        script: |
          flutter packages get
      - name: Compilar APK de Producción
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

  # WORKFLOW 2: SUBIDA A APPLE APP STORE CONNECT
  ios-app-store:
    name: Operia iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependencias Flutter y Pods
        script: |
          flutter packages get
          cd ios && pod install && cd ..
      - name: Compilar IPA para App Store
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa